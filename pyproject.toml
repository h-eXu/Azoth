[project]
name = "azoth"
version = "0.1.0"
description = "Transcrição e análise de áudios e vídeos via terminal"
authors = [{name = "Rodrigo Soares Tadewald", email = "rodrigo.tadewald@gmail.com"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "agno>=1.7.5",
    "ffmpeg-python>=0.2.0",
    "google-cloud-speech>=2.33.0",
    "groq>=0.30.0",
    "openai>=1.97.1",
    "openai-whisper>=20250625",
    "pyannote-audio>=3.3.2",
    "python-dotenv>=1.1.1",
    "pytubefix>=9.4.1",
    "sounddevice>=0.5.2",
    "soundfile>=0.13.1",
    "tinydb>=4.8.2",
    "customtkinter>=5.2.0",
    "torch>=2.7.0",
    "torchaudio>=2.7.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"

[project.scripts]
azoth = "azoth.main:main"
